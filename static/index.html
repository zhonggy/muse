<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muse-auto 控制台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">muse-auto<span class="tag">控制台</span></div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="tasks">任务</button>
    <button class="tab-btn" data-tab="cards">卡片</button>
    <button class="tab-btn" data-tab="settings">设置</button>
  </nav>
  <div class="topbar-right">
    <span id="conn" class="pill off">未连接</span>
    <span id="statLine" class="muted"></span>
  </div>
</header>

<main>
  <!-- ============ 任务 ============ -->
  <section id="tab-tasks" class="tab-panel active">
    <aside class="col-left">
      <div class="card">
        <h3>新建任务</h3>
        <p class="muted small">收件邮箱由 skymail API 自动创建，无需填写。</p>
        <div class="row">
          <label class="fld"><span>并发数</span>
            <input type="number" id="concurrency" min="1" max="8" value="1"></label>
          <label class="fld"><span>跑多少次</span>
            <input type="number" id="count" min="1" max="500" value="1"></label>
        </div>
        <label class="fld"><span>支付卡</span><select id="taskCard"></select></label>
        <div class="checks">
          <label class="chk"><input type="checkbox" id="liveView" checked> 启用实时画面</label>
          <label class="chk"><input type="checkbox" id="autostart" checked> 创建后立即开始</label>
        </div>
        <button class="primary block" id="btnCreate">开始运行</button>
        <div class="row wrap">
          <button id="btnStartAll">全部开始</button>
          <button id="btnStopAll">全部停止</button>
          <button id="btnClear">清理已完成</button>
          <a class="btn" href="/api/export?format=csv">导出 CSV</a>
          <a class="btn" href="/api/export?format=json">导出 JSON</a>
        </div>
      </div>

      <div class="card grow">
        <h3>任务列表 <span id="taskCount" class="muted"></span></h3>
        <div id="taskList" class="task-list"></div>
      </div>
    </aside>

    <section class="col-right">
      <div class="card">
        <div class="card-head">
          <h3 id="detailTitle">实时画面</h3>
          <div id="detailActions" class="actions"></div>
        </div>
        <div id="viewer" class="viewer" tabindex="0">
          <img id="live" alt="实时画面" draggable="false">
          <div id="viewerHint" class="viewer-hint">选择左侧任务，查看浏览器实时画面<br><span class="muted">可直接点击画面进行人工接管</span></div>
        </div>
        <div class="typebar">
          <input id="typeInput" placeholder="手动输入文本 → 回车发送到浏览器">
          <button id="btnType">发送文本</button>
          <button data-key="Enter">Enter</button>
          <button data-key="Tab">Tab</button>
          <button data-key="Escape">Esc</button>
          <button data-scroll="-500">↑</button>
          <button data-scroll="500">↓</button>
        </div>
      </div>

      <div class="card grow">
        <div class="card-head">
          <h3>日志</h3>
          <button class="mini" id="btnClearLogs">清屏</button>
        </div>
        <div id="logs" class="logs"></div>
      </div>
    </section>
  </section>

  <!-- ============ 卡片 ============ -->
  <section id="tab-cards" class="tab-panel">
    <div class="card">
      <h3>新增支付卡</h3>
      <p class="muted small">卡号与 CVV 使用 Fernet 加密后落盘（data/secret.key 或 MUSE_SECRET_KEY），接口只返回脱敏卡号。</p>
      <div class="row">
        <label class="fld" style="flex:2 1 260px"><span>卡号</span>
          <input id="c_number" inputmode="numeric" placeholder="4242424242424242"></label>
        <label class="fld"><span>有效期</span>
          <input id="c_exp" placeholder="MM/YY" maxlength="7"></label>
        <label class="fld"><span>CVV</span>
          <input id="c_cvc" inputmode="numeric" placeholder="123" maxlength="4"></label>
      </div>
      <button class="primary" id="btnAddCard">保存卡片</button>
    </div>
    <div class="card">
      <h3>已保存卡片</h3>
      <div id="cardList" class="card-list"></div>
    </div>
  </section>

  <!-- ============ 设置 ============ -->
  <section id="tab-settings" class="tab-panel">
    <div class="card">
      <h3>skymail 收码</h3>
      <div class="grid3">
        <label class="fld"><span>API 地址</span><input id="s_base"></label>
        <label class="fld"><span>登录邮箱</span><input id="s_email"></label>
        <label class="fld"><span>登录密码</span><input id="s_password" type="password" placeholder="留空表示不修改"></label>
        <label class="fld"><span>验证码超时（秒）</span><input id="s_code_timeout" type="number"></label>
        <label class="fld"><span>轮询间隔（秒）</span><input id="s_code_poll_interval" type="number" step="0.5"></label>
      </div>
      <label class="chk"><input type="checkbox" id="skymailCreate"> 顺便试建一个邮箱（验证自动建邮箱能力）</label>
      <button id="btnTestSkymail">测试连接</button>
      <span id="skymailResult" class="muted small"></span>
    </div>

    <div class="card">
      <h3>浏览器与任务</h3>
      <div class="grid3">
        <label class="fld"><span>muse 地址</span><input id="s_muse_url"></label>
        <label class="fld"><span>默认卡片</span><select id="s_default_card_id"></select></label>
        <label class="fld"><span>并发数</span><input id="s_concurrency" type="number" min="1" max="8"></label>
        <label class="fld"><span>截图间隔（秒）</span><input id="s_screenshot_interval" type="number" step="0.5"></label>
        <label class="fld"><span>单步超时（秒）</span><input id="s_step_timeout" type="number"></label>
        <label class="fld"><span>代理（可选）</span><input id="s_proxy" placeholder="http://user:pass@host:port"></label>
        <label class="fld"><span>时区</span><input id="s_timezone"></label>
        <label class="fld"><span>语言</span><input id="s_locale"></label>
      </div>
      <div class="checks">
        <label class="chk"><input type="checkbox" id="s_headless"> 无头模式（服务器上一般保持勾选）</label>
        <label class="chk"><input type="checkbox" id="s_auto_fill_card"> 自动填写控制台保存的卡片</label>
        <label class="chk"><input type="checkbox" id="s_stop_at_verification"> 到年龄验证页即停止（不绑卡）</label>
        <label class="chk"><input type="checkbox" id="s_manual_takeover"> 允许控制台点击接管</label>
      </div>
      <button class="primary" id="btnSaveSettings">保存设置</button>
      <span id="settingsResult" class="muted small"></span>
    </div>

    <div class="card">
      <h3>已保存登录态（sessions/）</h3>
      <div id="sessionList" class="card-list"></div>
    </div>
  </section>
</main>

<!-- 弹窗：等待卡信息 / 人工确认 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle">需要输入</h3>
    <p id="modalDesc" class="muted small"></p>
    <div id="modalBody"></div>
    <div class="row end">
      <button id="modalCancel">取消</button>
      <button class="primary" id="modalOk">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/app.js"></script>
</body>
</html>
